<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280"><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="42" font-size="28" font-family="Arial" font-weight="700" fill="#111827">Demand Forecasting Snapshot</text><text x="40" y="68" font-size="15" font-family="Arial" fill="#4b5563">A compact view of forecast quality and inventory exposure from the bundled demo run.</text><rect x="40" y="90" rx="18" ry="18" width="260" height="150" fill="#dbeafe" stroke="#e5e7eb"/><text x="60" y="128" font-size="15" font-family="Arial" fill="#374151">Best model</text><text x="60" y="176" font-size="28" font-family="Arial" font-weight="700" fill="#111827">RollingMean_7D</text><text x="60" y="208" font-size="13" font-family="Arial" fill="#6b7280">Bundled demo run</text><rect x="330" y="90" rx="18" ry="18" width="260" height="150" fill="#dcfce7" stroke="#e5e7eb"/><text x="350" y="128" font-size="15" font-family="Arial" fill="#374151">RMSE</text><text x="350" y="176" font-size="28" font-family="Arial" font-weight="700" fill="#111827">7.84</text><text x="350" y="208" font-size="13" font-family="Arial" fill="#6b7280">Lower is better</text><rect x="620" y="90" rx="18" ry="18" width="260" height="150" fill="#ede9fe" stroke="#e5e7eb"/><text x="640" y="128" font-size="15" font-family="Arial" fill="#374151">Top store risk</text><text x="640" y="176" font-size="28" font-family="Arial" font-weight="700" fill="#111827">S2</text><text x="640" y="208" font-size="13" font-family="Arial" fill="#6b7280">Largest inventory exposure</text><rect x="910" y="90" rx="18" ry="18" width="260" height="150" fill="#fee2e2" stroke="#e5e7eb"/><text x="930" y="128" font-size="15" font-family="Arial" fill="#374151">Top product risk</text><text x="930" y="176" font-size="28" font-family="Arial" font-weight="700" fill="#111827">P3</text><text x="930" y="208" font-size="13" font-family="Arial" fill="#6b7280">Largest product exposure</text></svg>